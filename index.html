<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Bike Race</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #canvas { display: block; }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 9999;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #score {
            position: fixed;
            top: 15px;
            left: 20px;
            color: white;
            font-size: 28px;
            z-index: 9998;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div id="overlay">TAP TO START</div>
    <div id="score">Score: 0</div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
    <script>
        // Game variables
        let scene, camera, renderer;
        let bike;
        let coins = [];
        let obstacles = [];
        let score = 0;
        let gameRunning = false;
        let currentLane = 1;
        const lanePositions = [-2.5, 0, 2.5];
        const coinSpeed = 0.15;
        const obstacleSpeed = 0.15;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.lookAt(0, 0, -5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87CEEB);
            document.body.appendChild(renderer.domElement);

            // Ground (grass)
            const grassGeo = new THREE.PlaneGeometry(50, 500);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.z = -100;
            scene.add(grass);

            // Road
            const roadGeo = new THREE.PlaneGeometry(10, 500);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.01;
            road.position.z = -100;
            scene.add(road);

            // Lane lines
            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.2, 500);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.02;
                line.position.x = i * 2.5;
                line.position.z = -100;
                scene.add(line);
            }

            // Create bike group
            bike = new THREE.Group();

            // Back wheel
            const wheelGeo = new THREE.TorusGeometry(0.4, 0.15, 16, 32);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const backWheel = new THREE.Mesh(wheelGeo, wheelMat);
            backWheel.rotation.y = Math.PI / 2;
            backWheel.position.set(-0.8, 0.4, 0);
            bike.add(backWheel);

            // Front wheel
            const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
            frontWheel.rotation.y = Math.PI / 2;
            frontWheel.position.set(0.8, 0.4, 0);
            bike.add(frontWheel);

            // Frame
            const frameGeo = new THREE.BoxGeometry(0.2, 0.2, 1.8);
            const frameMat = new THREE.MeshLambertMaterial({ color: 0xFF6600 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(0, 0.9, 0);
            bike.add(frame);

            // Seat
            const seatGeo = new THREE.BoxGeometry(0.4, 0.15, 0.5);
            const seatMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const seat = new THREE.Mesh(seatGeo, seatMat);
            seat.position.set(0, 1.2, -0.4);
            bike.add(seat);

            // Handlebars
            const handleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 16);
            const handleMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const handlebars = new THREE.Mesh(handleGeo, handleMat);
            handlebars.rotation.z = Math.PI / 2;
            handlebars.position.set(0, 1.3, 0.6);
            bike.add(handlebars);

            bike.position.set(0, 0, 0);
            scene.add(bike);

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(5, 10, 5);
            scene.add(directional);

            // Click to start
            document.getElementById('overlay').addEventListener('click', function(e) { startGame(e); });
            document.getElementById('overlay').addEventListener('touchstart', function(e) { startGame(e); }, {passive: false});

            // Touch controls
            document.addEventListener('touchstart', handleTouch);
            document.addEventListener('mousedown', handleClick);

            // Resize
            window.addEventListener('resize', onResize);

            render();
        }

        function handleTouch(e) {
            if (!gameRunning) return;
            e.preventDefault();
            e.stopPropagation();
            const touchX = e.touches[0].clientX;
            moveBike(touchX);
        }

        function handleClick(e) {
            if (!gameRunning) return;
            e.stopPropagation();
            moveBike(e.clientX);
        }

        function moveBike(x) {
            if (x < window.innerWidth / 2) {
                currentLane--;
            } else {
                currentLane++;
            }
            currentLane = Math.max(0, Math.min(2, currentLane));
            bike.position.x = lanePositions[currentLane];
        }

        function startGame(e) {
            if (gameRunning) return;
            if (e) e.preventDefault();
            if (e) e.stopPropagation();
            gameRunning = true;
            score = 0;
            currentLane = 1;
            bike.position.x = 0;
            document.getElementById('score').innerText = 'Score: 0';
            document.getElementById('overlay').style.display = 'none';
            
            // Clear old objects
            coins.forEach(c => scene.remove(c));
            obstacles.forEach(o => scene.remove(o));
            coins = [];
            obstacles = [];

            gameLoop();
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Spawn coin
            if (Math.random() < 0.02) {
                createCoin();
            }

            // Spawn obstacle
            if (Math.random() < 0.015) {
                createObstacle();
            }

            // Move and check coins
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].position.z += coinSpeed;
                coins[i].rotation.y += 0.1;

                if (coins[i].position.z > 5) {
                    scene.remove(coins[i]);
                    coins.splice(i, 1);
                } else if (bike.position.distanceTo(coins[i].position) < 1.5) {
                    scene.remove(coins[i]);
                    coins.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = 'Score: ' + score;
                }
            }

            // Move and check obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += obstacleSpeed;

                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                } else if (bike.position.distanceTo(obstacles[i].position) < 1.2) {
                    gameOver();
                    return;
                }
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        function createCoin() {
            const geo = new THREE.TorusGeometry(0.4, 0.15, 16, 32);
            const mat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.y = Math.PI / 2;
            const lane = Math.floor(Math.random() * 3);
            coin.position.set(lanePositions[lane], 0.8, -30);
            scene.add(coin);
            coins.push(coin);
        }

        function createObstacle() {
            const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const mat = new THREE.MeshLambertMaterial({ color: 0xFF0000 });
            const obs = new THREE.Mesh(geo, mat);
            const lane = Math.floor(Math.random() * 3);
            obs.position.set(lanePositions[lane], 0.6, -30);
            scene.add(obs);
            obstacles.push(obs);
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('overlay').innerText = 'GAME OVER!\nScore: ' + score + '\n\nTAP TO RESTART';
            document.getElementById('overlay').style.display = 'flex';
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
